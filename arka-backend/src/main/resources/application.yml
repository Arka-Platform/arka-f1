server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: arka-backend
  datasource:
    url: jdbc:h2:mem:arka;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins:
      - http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.security: WARN

---
# Local development overrides
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:arka_local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000

