server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: arka-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: jdbc:h2:mem:arka;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins:
      - http://localhost:5173
  books-dataset:
    enabled: false  # Disable in production - CSV files may not be in container
    books-csv-path: resources/books_data/books.csv
    ratings-csv-path: resources/books_data/ratings.csv
    max-books: 8000
    batch-size: 500
    min-rating-count: 5
  aws:
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME:}
      region: ${AWS_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.security: WARN

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arka}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}  # Must be set - no default to prevent empty password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:5173}
  books-dataset:
    enabled: false  # Disable in production - CSV files may not be in container
  aws:
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME:}
      region: ${AWS_REGION:us-east-1}

---
# Local development overrides
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:arka_local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
  jpa:
    hibernate:
      ddl-auto: create-drop  # Auto-create schema from entities for local dev
  flyway:
    enabled: false  # Disable Flyway for local development

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
  books-dataset:
    enabled: true
    max-books: 6000
    batch-size: 400
    min-rating-count: 3











