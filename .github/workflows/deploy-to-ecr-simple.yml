name: Build and Push to ECR (Simple - Using Access Keys)

on:
  push:
    branches:
      - dev
      - main
      - master
    paths:
      - 'frontend/**'
      - 'arka-backend/**'
      - 'Dockerfile'
  pull_request:
    branches:
      - dev
      - main
      - master
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: arka-dev-app
  AWS_ACCOUNT_ID: 600751737236
  ECS_CLUSTER: arka-dev-cluster
  ECS_SERVICE: arka-dev-service

jobs:
  build-and-push:
    name: Build Docker Image, Push to ECR, and Update ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify secrets are set
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "❌ ERROR: AWS_ACCESS_KEY_ID secret is not set or empty"
            exit 1
          fi
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "❌ ERROR: AWS_SECRET_ACCESS_KEY secret is not set or empty"
            exit 1
          fi
          echo "✅ Secrets are accessible (checking length only, not values)"
          echo "AWS_ACCESS_KEY_ID length: ${#AWS_ACCESS_KEY_ID}"
          echo "AWS_SECRET_ACCESS_KEY length: ${#AWS_SECRET_ACCESS_KEY}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR repository if it doesn't exist
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Verify we're in the right directory and Dockerfile exists
          pwd
          ls -la Dockerfile || (echo "❌ Dockerfile not found!" && exit 1)
          
          # Build Docker image
          echo "📦 Building Docker image from $(pwd)..."
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG -f Dockerfile .
          docker tag $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          
          # Push both tags
          echo "📤 Pushing image to ECR..."
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          
          echo "image=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_latest=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest" >> $GITHUB_OUTPUT

      - name: Update ECS Service
        run: |
          echo "🔄 Updating ECS service to use new image..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ ECS service update initiated!"
          echo "Service will deploy the new image. Check status with:"
          echo "  aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }} --region ${{ env.AWS_REGION }}"

      - name: Output image URI
        run: |
          echo "✅ Image pushed and ECS service updated!"
          echo "Image URI: ${{ steps.build-image.outputs.image }}"
          echo "Latest tag: ${{ steps.build-image.outputs.image_latest }}"
          echo ""
          echo "ECS service '${{ env.ECS_SERVICE }}' is being updated with the new image."
